[custom]
# ========== 原配置底层设置完全原样保留，不做任何修改 ==========
dns.enable=true
dns.default-nameserver=223.5.5.5,119.29.29.29,114.114.114.114
dns.use-hosts=true
dns.nameserver=https://sm2.doh.pub/dns-query,https://dns.alidns.com/dns-query
dns.fallback=8.8.4.4,208.67.220.220
dns.fallback-filter.geoip=true
dns.fallback-filter.geoip-code=CN
dns.fallback-filter.ipcidr=240.0.0.0/4,127.0.0.1/32,0.0.0.0/32
dns.fallback-filter.domain=+.google.com,+.facebook.com,+.youtube.com
dns.nameserver-policy={"okyouyou.ccwu.cc":"https://dns.alidns.com/dns-query","cloudflare-ech.com":"https://dns.alidns.com/dns-query"}

port=7890
socks-port=7891
allow-lan=true
mode=rule
log-level=info
external-controller=127.0.0.1:9090

# ========== 主代理组：🚀节点选择 / ♻️自动选择 / 🔯故障转移 / 🔮负载均衡 ==========
# 重点：这里{{.Proxies}} 全部节点，**没有reject过滤，香港节点完整保留，测速、手动切换都可见**
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🔯 故障转移"
      - "🔮 负载均衡"
      - DIRECT
      {{range .Proxies}}
      - {{.Name}}
      {{end}}

  - name: "♻️ 自动选择"
    type: url‑test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      {{range .Proxies}}
      - {{.Name}}
      {{end}}

  - name: "🔯 故障转移"
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 180
    proxies:
      {{range .Proxies}}
      - {{.Name}}
      {{end}}

  - name: "🔮 负载均衡"
    type: load‑balance
    strategy: consistent‑hashing
    url: http://www.gstatic.com/generate_204
    interval: 180
    proxies:
      {{range .Proxies}}
      - {{.Name}}
      {{end}}

# ==========【唯一过滤：AI专用组！！只在这里剔除HK/香港/hk节点】 ==========
# 仅这个组内部不要香港节点，专门给category‑ai‑!cn AI域名使用
  - name: "🤖 AI服务(排除HK)"
    type: url‑test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      {{range .Proxies}}{{if not (reject .Name "HK" "香港" "hk")}}
      - {{.Name}}
      {{end}}{{end}}

# ========== 下面这几组全部沿用全部节点，香港节点正常可用 ==========
  - name: "🎯 全球直连"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
      - "♻️ 自动选择"

  - name: "🛑 全球拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🎯 全球直连"
      - "♻️ 自动选择"
      - "🔯 故障转移"
      - "🔮 负载均衡"
      {{range .Proxies}}
      - {{.Name}}
      {{end}}

  - name: "☁️ CloudFlareCDN"
    type: select
    proxies:
      - "🐟 漏网之鱼"
      - "🚀 节点选择"
      - "🎯 全球直连"
      - "♻️ 自动选择"
      - "🔯 故障转移"
      - "🔮 负载均衡"
      {{range .Proxies}}
      - {{.Name}}
      {{end}}

# ========= Rules规则 =========
# AI网站优先匹配，强制交给【🤖 AI服务(排除HK)】，永远不走香港节点
rules:
  - GEOSITE,category‑ai‑!cn,🤖 AI服务(排除HK)

