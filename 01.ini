custom_proxy_group=🇹🇼 TW`url-test`!!GROUPID=0!!(?i)(🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet)`https://www.gstatic.com/generate_204`300,300
custom_proxy_group=🇯🇵 JP`url-test`!!GROUPID=0!!(?i)(🇯🇵|日本|\\bJP\\b|tokyo|osaka)`https://www.gstatic.com/generate_204`300,300
