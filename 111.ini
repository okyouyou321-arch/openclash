[custom]
# ========== 原配置底层设置，修正符号，移除无法解析的nameserver-policy ==========
dns.enable=true
dns.default-nameserver=223.5.5.5,119.29.29.29,114.114.114.114
dns.use-hosts=true
dns.nameserver=https://sm2.doh.pub/dns-query,https://dns.alidns.com/dns-query
dns.fallback=8.8.4.4,208.67.220.220
dns.fallback-filter.geoip=true
dns.fallback-filter.geoip-code=CN
dns.fallback-filter.ipcidr=240.0.0.0/4,127.0.0.1/32,0.0.0.0/32
dns.fallback-filter.domain=+.google.com,+.facebook.com,+.youtube.com

port=7890
socks-port=7891
allow-lan=true
mode=rule
log-level=info
external-controller=127.0.0.1:9090

# ========== 主代理组：全部节点保留，香港节点可见 ==========
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🔯 故障转移"
      - "🔮 负载均衡"
      - DIRECT
      {{range .Proxies}}
      - {{.Name}}
      {{end}}

  - name: "♻️ 自动选择"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      {{range .Proxies}}
      - {{.Name}}
      {{end}}

  - name: "🔯 故障转移"
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 180
    proxies:
      {{range .Proxies}}
      - {{.Name}}
      {{end}}

  - name: "🔮 负载均衡"
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 180
    proxies:
      {{range .Proxies}}
      - {{.Name}}
      {{end}}

# ========== AI专用组：仅本组过滤HK/香港/hk节点 ==========
  - name: "🤖 AI服务(排除HK)"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      {{range .Proxies}}{{if not (reject .Name "HK" "香港" "hk")}}
      - {{.Name}}
      {{end}}{{end}}

  - name: "🎯 全球直连"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
      - "♻️ 自动选择"

  - name: "🛑 全球拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🎯 全球直连"
      - "♻️ 自动选择"
      - "🔯 故障转移"
      - "🔮 负载均衡"
      {{range .Proxies}}
      - {{.Name}}
      {{end}}

  - name: "☁️ CloudFlareCDN"
    type: select
    proxies:
      - "🐟 漏网之鱼"
      - "🚀 节点选择"
      - "🎯 全球直连"
      - "♻️ 自动选择"
      - "🔯 故障转移"
      - "🔮 负载均衡"
      {{range .Proxies}}
      - {{.Name}}
      {{end}}

# ========= Rules规则 =========
rules:
  - GEOSITE,category-ai-!cn,🤖 AI服务(排除HK)

  - DOMAIN-SUFFIX,play.googleapis.com,🚀 节点选择
  - DOMAIN-SUFFIX,play-fe.googleapis.com,🚀 节点选择
  - DOMAIN-SUFFIX,play-lh.googleusercontent.com,🚀 节点选择
  - DOMAIN,dl.google.com,🚀 节点选择
  - DOMAIN-SUFFIX,dl.google.com,🚀 节点选择
  - DOMAIN-SUFFIX,services.googleapis.cn,🚀 节点选择
  - DOMAIN-SUFFIX,acl4.ssr,🎯 全球直连
  - DOMAIN-SUFFIX,ip6-localhost,🎯 全球直连
  - DOMAIN-SUFFIX,ip6-loopback,🎯 全球直连
  - DOMAIN-SUFFIX,internal,🎯 全球直连
  - DOMAIN-SUFFIX,lan,🎯 全球直连
  - DOMAIN-SUFFIX,local,🎯 全球直连
  - DOMAIN-SUFFIX,localhost,🎯 全球直连
  - IP-CIDR,0.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,10.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,100.64.0.0/10,🎯 全球直连,no-resolve
  - IP-CIDR,127.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,169.254.0.0/16,🎯 全球直连,no-resolve
  - IP-CIDR,172.16.0.0/12,🎯 全球直连,no-resolve
  - IP-CIDR,192.168.0.0/16,🎯 全球直连,no-resolve
  - IP-CIDR,198.18.0.0/16,🎯 全球直连,no-resolve
  - IP-CIDR,224.0.0.0/4,🎯 全球直连,no-resolve
  - IP-CIDR6,::1/128,🎯 全球直连,no-resolve
  - IP-CIDR6,fc00::/7,🎯 全球直连,no-resolve
  - IP-CIDR6,fe80::/10,🎯 全球直连,no-resolve
  - IP-CIDR6,fd00::/8,🎯 全球直连,no-resolve

  - MATCH,🐟 漏网之鱼
