custom_proxy_group=🇺🇸 US`url-test`!!GROUPID=0!!(?i)(🇺🇸|美国|\\bUS\\b|united states|los angeles|san jose|seattle|new york)`https://www.gstatic.com/generate_204`300,300
custom_proxy_group=🧊 冷门节点`select`!!GROUPID=0!!(?i)^(?!.*(🇭🇰|香港|\\bHK\\b|hong\\s*kong|🇯🇵|日本|\\bJP\\b|tokyo|osaka|🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet|🇸🇬|新加坡|\\bSG\\b|singapore|🇺🇸|美国|\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)).*
